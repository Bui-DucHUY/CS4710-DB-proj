<div class="container fade-in">
  <h2 class="mb-4">Provider Management</h2>

  <div class="row">
    <!-- List of Providers -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h5 class="mb-0">Medical Staff Directory</h5>
        </div>
        <div class="card-body p-0">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialty</th>
                <th>Address</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let p of providers">
                <td>{{ p.providerID }}</td>
                <td>{{ p.firstName }} {{ p.lastName }}</td>
                <td><span class="badge bg-info text-dark">{{ p.specialty }}</span></td>
                <td>{{ p.addrss }}</td>
                <td>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteProvider(p.providerID)">
                    Delete
                  </button>
                </td>
              </tr>
              <tr *ngIf="providers.length === 0">
                <td colspan="5" class="text-center text-muted py-4">No providers found. Add one!</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Add New Provider Form -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Add New Provider</h5>
        </div>
        <div class="card-body">
          <form (ngSubmit)="addProvider()">
            <div class="mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" [(ngModel)]="newProvider.firstName" name="firstName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" [(ngModel)]="newProvider.lastName" name="lastName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Specialty</label>
              <input type="text" class="form-control" [(ngModel)]="newProvider.specialty" name="specialty">
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" [(ngModel)]="newProvider.addrss" name="addrss">
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Provider</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
